<title>瘋狂救護車</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="開著救護車在椰子島上狂飆，接起路邊的病人，限時送到他指定的醫院。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&display=swap">
<style>
/* Layout: full-bleed WebGL island; cream parchment pills float over it, echoing the cozy game UI in the reference video. Single bright daytime look (no dark theme by design). */
:root {
  --cream: #f8f1de;
  --cream-2: #efe2c0;
  --tan: #e6cf9f;
  --ink: #4b3424;
  --ink-soft: #80614a;
  --line: #8d6c4d;
  --night: #2b2521;
  --sea: #1db0a6;
  --sea-deep: #0f7d84;
  --red: #e23b33;
  --red-deep: #a3221c;
  --gen: #2fae6b;
  --ortho: #3a86e0;
  --heart: #e5484d;
  --kids: #f0a12a;
  --white: #ffffff;
  --shadow: rgba(60, 38, 20, 0.28);
  --font-num: "Fredoka", "Huninn", "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
  --font: "Huninn", "Fredoka", "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
  color-scheme: light;
}
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--sea-deep);
  color: var(--ink);
  font-family: var(--font);
  overflow: hidden;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior: none;
}
#app { position: fixed; inset: 0; overflow: hidden; touch-action: none; background: var(--sea-deep); }
#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

/* ---------- shared pieces ---------- */
.pill {
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--cream); color: var(--ink);
  border: 1.5px solid var(--line); border-radius: 9px;
  padding: 3px 10px; font-size: 14px; line-height: 1.25;
  box-shadow: 0 2px 0 var(--shadow);
  white-space: nowrap;
}
.key {
  display: inline-grid; place-items: center;
  min-width: 26px; height: 26px; padding: 0 7px; box-sizing: border-box;
  border-radius: 13px; background: var(--night); color: var(--white);
  font-family: var(--font-num); font-weight: 600; font-size: 12px;
}
.badge {
  flex: none; display: grid; place-items: center;
  width: 38px; height: 38px; border-radius: 50%;
  background: var(--tan); border: 2px solid var(--line);
  box-shadow: inset 0 -3px 0 rgba(120, 85, 50, 0.25);
}
.badge svg { width: 22px; height: 22px; }

/* ---------- HUD ---------- */
#hud {
  position: absolute; inset: 0; pointer-events: none;
  padding-top: calc(10px + env(safe-area-inset-top, 0px));
  padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  box-sizing: border-box;
}
.hud-top { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: start; }
.timer {
  position: relative; width: 74px; height: 74px; border-radius: 50%;
  background: var(--cream); border: 2px solid var(--line);
  box-shadow: 0 3px 0 var(--shadow);
  display: grid; place-items: center; text-align: center;
}
.timer b { font-family: var(--font-num); font-weight: 700; font-size: 30px; line-height: 1; font-variant-numeric: tabular-nums; color: var(--ink); }
.timer small { position: absolute; bottom: 9px; left: 0; right: 0; font-size: 11px; color: var(--ink-soft); }
.timer.low { background: #ffe1d8; border-color: var(--red-deep); animation: beat 0.5s ease-in-out infinite alternate; }
.timer.low b { color: var(--red-deep); }
@keyframes beat { from { transform: scale(1); } to { transform: scale(1.07); } }
.timer .plus { position: absolute; right: -14px; top: -8px; font-family: var(--font-num); font-weight: 700; font-size: 16px; color: var(--gen); opacity: 0; }
.timer .plus.show { animation: plusUp 1.2s ease-out; }
@keyframes plusUp { 0% { opacity: 0; transform: translateY(6px); } 15% { opacity: 1; } 100% { opacity: 0; transform: translateY(-18px); } }

.mission {
  justify-self: center; min-width: 0; max-width: 420px; width: 100%;
  display: flex; align-items: center; gap: 9px;
  background: var(--cream); border: 2px solid var(--line); border-radius: 14px;
  padding: 7px 10px 9px 7px; box-shadow: 0 3px 0 var(--shadow); box-sizing: border-box;
  position: relative; overflow: hidden;
}
.mission .mtext { min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.mission .mtitle { font-size: 16px; line-height: 1.2; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mission .msub { font-size: 12.5px; color: var(--ink-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
.mission .pbar { position: absolute; left: 0; right: 0; bottom: 0; height: 4px; background: rgba(139, 107, 76, 0.18); }
.mission .pbar i { display: block; height: 100%; width: 0%; background: var(--gen); transition: width 0.2s linear; }

.side { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
#minimap {
  width: 116px; height: 116px; border-radius: 50%;
  border: 2.5px solid var(--line); background: var(--sea-deep);
  box-shadow: 0 3px 0 var(--shadow); display: block;
}
.money { font-family: var(--font-num); font-weight: 600; font-size: 16px; font-variant-numeric: tabular-nums; }
.money .saved { font-family: var(--font); font-weight: 400; font-size: 12px; color: var(--ink-soft); }

#bubble {
  position: absolute; left: 50%; top: calc(172px + env(safe-area-inset-top, 0px));
  transform: translateX(-50%);
  width: min(360px, calc(100% - 40px)); box-sizing: border-box;
  background: var(--white); border: 2px solid var(--line); border-radius: 16px;
  padding: 9px 12px 10px; box-shadow: 0 4px 0 var(--shadow);
  display: flex; gap: 10px; align-items: center;
  font-size: 15px; line-height: 1.35;
}
#bubble::after {
  content: ""; position: absolute; left: 50%; bottom: -9px; width: 14px; height: 14px;
  background: var(--white); border-right: 2px solid var(--line); border-bottom: 2px solid var(--line);
  transform: translateX(-50%) rotate(45deg);
}
#bubble .who { font-size: 12px; color: var(--ink-soft); }
#bubble.pop { animation: pop 0.35s cubic-bezier(.2, 1.6, .4, 1); }
@keyframes pop { from { transform: translateX(-50%) scale(0.6); opacity: 0; } to { transform: translateX(-50%) scale(1); opacity: 1; } }

#toasts {
  position: absolute; left: 0; right: 0; top: 42%;
  display: flex; flex-direction: column; align-items: center; gap: 6px;
}
.toast {
  font-size: 17px; padding: 5px 13px; border-radius: 11px;
  background: var(--cream); border: 2px solid var(--line); box-shadow: 0 3px 0 var(--shadow);
  animation: toast 1.6s ease-out forwards;
}
.toast b { font-family: var(--font-num); font-weight: 700; color: var(--gen); }
.toast.bad b { color: var(--red-deep); }
@keyframes toast { 0% { opacity: 0; transform: translateY(14px) scale(0.85); } 12% { opacity: 1; transform: translateY(0) scale(1.05); } 20% { transform: scale(1); } 75% { opacity: 1; } 100% { opacity: 0; transform: translateY(-34px); } }

#bigmsg {
  position: absolute; left: 0; right: 0; top: 27%; text-align: center;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  font-size: clamp(34px, 9vw, 64px); line-height: 1.1; color: var(--white);
  text-shadow: 0 0 1px var(--ink), 3px 0 0 var(--ink), -3px 0 0 var(--ink), 0 3px 0 var(--ink), 0 -3px 0 var(--ink),
    2px 2px 0 var(--ink), -2px 2px 0 var(--ink), 2px -2px 0 var(--ink), -2px -2px 0 var(--ink), 0 7px 0 rgba(60, 38, 20, 0.35);
  opacity: 0; pointer-events: none;
}
#bigmsg small { display: block; font-size: 0.42em; margin-top: 8px; }
#bigmsg.show { animation: big 1.7s ease-out forwards; }
@keyframes big { 0% { opacity: 0; transform: scale(0.5); } 14% { opacity: 1; transform: scale(1.12); } 24% { transform: scale(1); } 78% { opacity: 1; } 100% { opacity: 0; transform: scale(1.04); } }

.keys {
  position: absolute; left: max(16px, env(safe-area-inset-left, 0px)); bottom: calc(14px + env(safe-area-inset-bottom, 0px));
  display: flex; flex-wrap: wrap; gap: 8px 14px; max-width: calc(100% - 32px);
}
.keys span.k { display: inline-flex; align-items: center; gap: 6px; }
#pauseBtn {
  pointer-events: auto; position: absolute;
  left: calc(max(16px, env(safe-area-inset-left, 0px)) + 52px); top: calc(66px + env(safe-area-inset-top, 0px));
  width: 34px; height: 34px; border-radius: 50%; border: 2px solid var(--line);
  background: var(--cream); color: var(--ink); display: grid; place-items: center; padding: 0;
  box-shadow: 0 2px 0 var(--shadow); cursor: pointer;
}
#pauseBtn svg { width: 14px; height: 14px; }

/* ---------- touch controls ---------- */
#touch {
  position: absolute; inset: auto 0 0 0; height: 0; pointer-events: none;
}
.tbtn {
  position: absolute; pointer-events: auto; touch-action: none;
  border-radius: 50%; border: 2.5px solid var(--line);
  background: rgba(248, 241, 222, 0.88); color: var(--ink);
  box-shadow: 0 4px 0 var(--shadow), inset 0 -5px 0 rgba(120, 85, 50, 0.18);
  display: grid; place-items: center; padding: 0;
  font-family: var(--font); font-size: 15px;
}
.tbtn svg { width: 40%; height: 40%; }
.tbtn.on { background: var(--tan); transform: translateY(3px); box-shadow: 0 1px 0 var(--shadow), inset 0 3px 0 rgba(120, 85, 50, 0.25); }
.tbtn .lbl { position: absolute; bottom: -10px; left: 50%; transform: translateX(-50%); font-size: 12px; padding: 1px 8px; }
#tLeft  { width: 84px; height: 84px; left: max(16px, env(safe-area-inset-left, 0px)); bottom: calc(26px + env(safe-area-inset-bottom, 0px)); }
#tRight { width: 84px; height: 84px; left: calc(max(16px, env(safe-area-inset-left, 0px)) + 96px); bottom: calc(26px + env(safe-area-inset-bottom, 0px)); }
#tGas   { width: 96px; height: 96px; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(26px + env(safe-area-inset-bottom, 0px)); background: rgba(205, 238, 215, 0.92); }
#tBrake { width: 74px; height: 74px; right: calc(max(16px, env(safe-area-inset-right, 0px)) + 108px); bottom: calc(26px + env(safe-area-inset-bottom, 0px)); background: rgba(255, 222, 214, 0.92); }
#tDrift { width: 68px; height: 68px; right: calc(max(16px, env(safe-area-inset-right, 0px)) + 14px); bottom: calc(138px + env(safe-area-inset-bottom, 0px)); }

/* ---------- screens ---------- */
.screen {
  position: absolute; inset: 0; display: grid; place-items: center;
  padding-top: calc(16px + env(safe-area-inset-top, 0px));
  padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  box-sizing: border-box; overflow-y: auto; -webkit-overflow-scrolling: touch;
  background: linear-gradient(180deg, rgba(15, 125, 132, 0.10), rgba(15, 125, 132, 0.38));
  touch-action: pan-y;
}
.card {
  width: min(560px, 100%); box-sizing: border-box;
  background: var(--cream); border: 2.5px solid var(--line); border-radius: 22px;
  box-shadow: 0 6px 0 var(--shadow), 0 18px 40px rgba(20, 40, 40, 0.25);
  padding: 22px 22px 20px; display: flex; flex-direction: column; gap: 14px;
  -webkit-user-select: none; user-select: none;
}
.logo { text-align: center; line-height: 1; }
.logo h1 {
  margin: 0; font-weight: 400; font-size: clamp(46px, 13vw, 76px); letter-spacing: 0.02em;
  color: var(--white); text-wrap: balance;
  text-shadow: 0 0 1px var(--red-deep), 4px 0 0 var(--red-deep), -4px 0 0 var(--red-deep), 0 4px 0 var(--red-deep), 0 -4px 0 var(--red-deep),
    3px 3px 0 var(--red-deep), -3px 3px 0 var(--red-deep), 3px -3px 0 var(--red-deep), -3px -3px 0 var(--red-deep),
    0 10px 0 rgba(90, 30, 20, 0.35);
}
.logo .sub { display: inline-flex; margin-top: 12px; font-size: 14px; letter-spacing: 0.08em; }
.lead { margin: 0; font-size: 15.5px; line-height: 1.6; text-align: center; color: var(--ink); text-wrap: balance; }
.lead em { font-style: normal; color: var(--red-deep); }
.hosp-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.hosp { display: flex; gap: 9px; align-items: center; background: var(--white); border: 1.5px solid rgba(141, 108, 77, 0.45); border-radius: 12px; padding: 7px 9px; min-width: 0; }
.hosp .badge { width: 34px; height: 34px; border-width: 0; box-shadow: none; }
.hosp .badge svg { width: 20px; height: 20px; }
.hosp .t { min-width: 0; }
.hosp .t b { display: block; font-weight: 400; font-size: 14.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hosp .t span { display: block; font-size: 12px; line-height: 1.35; color: var(--ink-soft); }
.controls { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px 14px; font-size: 13px; color: var(--ink-soft); }
.controls span { display: inline-flex; align-items: center; gap: 6px; }
.btn-row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.btn {
  font-family: var(--font); font-size: 20px; padding: 11px 30px; border-radius: 16px; cursor: pointer;
  border: 2.5px solid var(--red-deep); background: var(--red); color: var(--white);
  box-shadow: 0 5px 0 var(--red-deep); transition: transform 0.08s, box-shadow 0.08s;
}
.btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--red-deep); }
.btn.ghost { background: var(--cream-2); color: var(--ink); border-color: var(--line); box-shadow: 0 5px 0 var(--line); font-size: 16px; padding: 10px 18px; }
.btn.ghost:active { box-shadow: 0 1px 0 var(--line); }
.btn:focus-visible, #pauseBtn:focus-visible, .tbtn:focus-visible { outline: 3px solid var(--ortho); outline-offset: 3px; }
.best { text-align: center; font-size: 13px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.best b { font-family: var(--font-num); font-weight: 600; color: var(--ink); }

.over-head { text-align: center; }
.over-head h2 { margin: 0; font-weight: 400; font-size: 34px; }
.rank { display: inline-flex; align-items: center; gap: 10px; margin-top: 10px; padding: 6px 16px 6px 6px; border-radius: 30px; background: var(--white); border: 2px solid var(--line); }
.rank .letter { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; font-family: var(--font-num); font-weight: 700; font-size: 26px; color: var(--white); background: var(--red); border: 2px solid var(--red-deep); }
.rank .name { font-size: 18px; }
.stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.stat { background: var(--white); border: 1.5px solid rgba(141, 108, 77, 0.45); border-radius: 12px; padding: 8px 12px; }
.stat span { display: block; font-size: 12.5px; color: var(--ink-soft); }
.stat b { display: block; font-family: var(--font-num); font-weight: 600; font-size: 24px; font-variant-numeric: tabular-nums; }
.newbest { text-align: center; color: var(--red-deep); font-size: 15px; }

#loading {
  position: absolute; inset: 0; display: grid; place-items: center;
  background: var(--sea-deep); color: var(--cream); font-size: 18px; letter-spacing: 0.06em;
}
#loading .pill { font-size: 16px; padding: 8px 16px; }
#err { position: absolute; left: 16px; right: 16px; bottom: 16px; }

@media (max-width: 460px) {
  .card { padding: 18px 14px 16px; gap: 12px; }
  .hosp-grid { grid-template-columns: minmax(0, 1fr); }
  .timer { width: 62px; height: 62px; }
  .timer b { font-size: 25px; }
  .timer small { bottom: 7px; font-size: 10px; }
  #minimap { width: 96px; height: 96px; }
  .mission { padding: 6px 8px 8px 6px; gap: 7px; }
  .mission .badge { width: 32px; height: 32px; }
  .mission .badge svg { width: 18px; height: 18px; }
  .mission .mtitle { font-size: 14.5px; }
  .mission .msub { font-size: 11.5px; }
  #pauseBtn { left: calc(max(16px, env(safe-area-inset-left, 0px)) + 42px); top: calc(54px + env(safe-area-inset-top, 0px)); width: 30px; height: 30px; }
  #bubble { top: calc(146px + env(safe-area-inset-top, 0px)); font-size: 14px; }
}
@media (max-height: 520px) and (orientation: landscape) {
  .card { gap: 9px; padding: 14px 18px; }
  .logo h1 { font-size: 44px; }
  .lead { font-size: 14px; }
  #tDrift { bottom: calc(26px + env(safe-area-inset-bottom, 0px)); right: calc(max(16px, env(safe-area-inset-right, 0px)) + 196px); }
}
@keyframes fadeOnly { 0% { opacity: 0; } 10% { opacity: 1; } 80% { opacity: 1; } 100% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) {
  .timer.low, #bubble.pop { animation: none; }
  #bigmsg.show, .toast, .timer .plus.show { animation-name: fadeOnly; }
}
</style>

<div id="app">
  <canvas id="gl" aria-label="遊戲畫面"></canvas>

  <div id="hud" hidden>
    <div class="hud-top">
      <div class="timer" id="timer" aria-label="剩餘時間"><b id="timerNum">75</b><small>秒</small><span class="plus" id="timerPlus">+8</span></div>
      <div class="mission" id="mission">
        <span class="badge" id="missionIcon"></span>
        <div class="mtext"><span class="mtitle" id="missionTitle">去接病人</span><span class="msub" id="missionSub"></span></div>
        <div class="pbar"><i id="pbar"></i></div>
      </div>
      <div class="side">
        <canvas id="minimap" width="232" height="232" aria-label="小地圖"></canvas>
        <div class="pill money"><span id="money">$0</span><span class="saved" id="saved">救 0 人</span></div>
      </div>
    </div>
    <button id="pauseBtn" aria-label="暫停"><svg viewBox="0 0 14 14" aria-hidden="true"><rect x="2" y="1" width="3.6" height="12" rx="1.2" fill="currentColor"/><rect x="8.4" y="1" width="3.6" height="12" rx="1.2" fill="currentColor"/></svg></button>
    <div id="bubble" hidden>
      <span class="badge" id="bubbleIcon"></span>
      <div><div class="who" id="bubbleWho">病人</div><div id="bubbleText"></div></div>
    </div>
    <div id="toasts"></div>
    <div id="bigmsg"></div>
    <div class="keys" id="keys">
      <span class="k"><span class="key">W A S D</span><span class="pill">駕駛</span></span>
      <span class="k"><span class="key">Space</span><span class="pill">甩尾</span></span>
      <span class="k"><span class="key">P</span><span class="pill">暫停</span></span>
      <span class="k"><span class="key">M</span><span class="pill">音效</span></span>
    </div>
  </div>

  <div id="touch" hidden>
    <button class="tbtn" id="tLeft" data-k="left" aria-label="左轉"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.5 4 6.5 12l9 8z" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg></button>
    <button class="tbtn" id="tRight" data-k="right" aria-label="右轉"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8.5 4l9 8-9 8z" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg></button>
    <button class="tbtn" id="tBrake" data-k="brake" aria-label="煞車或倒車">煞車</button>
    <button class="tbtn" id="tGas" data-k="gas" aria-label="油門">油門</button>
    <button class="tbtn" id="tDrift" data-k="drift" aria-label="甩尾">甩尾</button>
  </div>

  <div id="title" class="screen" hidden>
    <div class="card">
      <div class="logo"><h1>瘋狂救護車</h1><span class="pill sub">椰子島急救任務</span></div>
      <p class="lead">接起路邊揮手的病人，在時限內送到<em>他指定的醫院</em>。送得越快，加的時間越多；載著病人甩尾、飛越還能拿小費。</p>
      <div class="hosp-grid" id="hospGrid"></div>
      <div class="controls" id="ctlHelp"></div>
      <div class="btn-row">
        <button class="btn" id="startBtn">出勤！</button>
        <button class="btn ghost" id="soundBtn">音效：開</button>
      </div>
      <div class="best" id="bestLine"></div>
    </div>
  </div>

  <div id="pause" class="screen" hidden>
    <div class="card" style="width:min(380px,100%)">
      <div class="over-head"><h2>暫停中</h2></div>
      <div class="btn-row">
        <button class="btn" id="resumeBtn">繼續</button>
        <button class="btn ghost" id="restartBtn">重新開始</button>
        <button class="btn ghost" id="soundBtn2">音效：開</button>
      </div>
    </div>
  </div>

  <div id="over" class="screen" hidden>
    <div class="card" style="width:min(460px,100%)">
      <div class="over-head">
        <h2 id="overTitle">下班了！</h2>
        <div class="rank"><span class="letter" id="rankLetter">A</span><span class="name" id="rankName">瘋狂王牌司機</span></div>

  addInstanced(scene, G.palm, MAT.double, palms, {});
  addInstanced(scene, G.bush, MAT.toon, bushes, { outline: MAT.olTree, cast: false });
  addInstanced(scene, G.rock, MAT.toon, tint(it.rock, [0xffffff, 0xeeeef2, 0xe0e2e6]), { outline: MAT.olRock, cast: false });

  addInstanced(scene, G.coral0, MAT.toon, it.coral0, { cast: false });
  addInstanced(scene, G.coral1, MAT.toon, it.coral1, { cast: false });
  addInstanced(scene, G.weed, MAT.toon, it.weed, { cast: false });
  addInstanced(scene, G.lily, MAT.toon, it.lily, { cast: false });
  return G;
}

function placer(x, z, rot) {

  return (lx, ly, lz, rx = 0, ry = 0, rz = 0, sx = 1, sy = 1, sz = 1) => m0.clone().multiply(M(lx, ly, lz, rx, ry, rz, sx, sy, sz));

function gableGeo(d, rh, w) {

}

function addHouse(x, z, rot, w, d, st) {
  const P = placer(x, z, rot);
  const h = st.h || rand(3.6, 4.6);

  if (st.plank) {
    const n = Math.max(4, Math.round(h / 0.6));
    for (let i = 0; i < n; i++) addStatic(box(w, h / n + 0.01, d), i % 2 ? st.wall : shade(st.wall, 0.88), P(0, 0.5 + (i + 0.5) * (h / n), 0));
  } else addStatic(box(w, h, d), st.wall, P(0, 0.5 + h / 2, 0));

  addStatic(box(1.7, 2.6, 0.24), 0x6e4a30, P(-w * 0.12, 0.5 + 1.3, d / 2 + 0.06));
  addStatic(box(0.22, 0.22, 0.1), 0xe9c46a, P(-w * 0.12 + 0.55, 0.5 + 1.3, d / 2 + 0.2));
  for (const sx of [-1, 1]) {
    const wx = sx > 0 ? w * 0.28 : -w * 0.38;
    if (sx < 0 && w < 9) continue;
    addStatic(box(1.6, 1.35, 0.14), 0xfdf6e8, P(wx, 0.5 + h * 0.6, d / 2 + 0.05));
    addStatic(box(1.25, 1.0, 0.18), 0x9ed6ea, P(wx, 0.5 + h * 0.6, d / 2 + 0.07));
    addStatic(box(1.7, 0.45, 0.6), 0x8a5a3a, P(wx, 0.5 + h * 0.6 - 0.85, d / 2 + 0.32));
    addStatic(new THREE.IcosahedronGeometry(0.42, 0), sx > 0 ? 0xf28fb0 : 0xf6d36b, P(wx, 0.5 + h * 0.6 - 0.45, d / 2 + 0.35, 0, 0, 0, 1.6, 0.8, 0.9), { flat: true });
  }
  for (const sx of [-1, 1]) addStatic(box(0.14, 1.1, 1.3), 0x9ed6ea, P(sx * (w / 2 + 0.03), 0.5 + h * 0.6, 0));
  const rh = Math.max(2.2, d * 0.36), over = 0.75;
  const halfD = d / 2 + over;
  const k = rh / (d / 2);
  const ang = Math.atan(k);
  const slopeLen = halfD * Math.sqrt(1 + k * k);
  const yTop = 0.5 + h;
  addStatic(gableGeo(d, rh, w), st.plank ? shade(st.wall, 0.95) : st.wall, P(0, yTop, 0));
  const planks = 6;
  for (const side of [-1, 1]) {
    for (let i = 0; i < planks; i++) {
      const t = (i + 0.5) / planks;
      const zz = halfD * (1 - t);
      const col = st.roof[(i + (side > 0 ? 0 : 2)) % st.roof.length];
      addStatic(box(w + over * 2, 0.24, slopeLen / planks + 0.04), col, P(0, yTop + rh - k * zz + 0.13, side * zz, side * ang, 0, 0));
    }
  }
  addStatic(box(w + over * 2 + 0.1, 0.32, 0.7), shade(st.roof[0], 0.75), P(0, yTop + rh + 0.14, 0));
  if (rng() < 0.6) addStatic(box(0.95, 2.2, 0.95), 0xb0583e, P(w * 0.26, yTop + rh * 0.55, -d * 0.18));
  boxCollider(x, z, w + 0.9, d + 0.9, rot);
}

function houseFits(x, z, w, d, rot) {
  const c = Math.cos(rot), s = Math.sin(rot);
  for (const lx of [-0.5, 0, 0.5]) for (const lz of [-0.5, 0, 0.5]) {
    const wx = x + lx * (w + 2) * c + lz * (d + 2) * s, wz = z - lx * (w + 2) * s + lz * (d + 2) * c;
    if (roadDist(wx, wz) < 1.2) return false;
    if (landF(wx, wz) < 5) return false;
    if (pointInPoly(wx, wz, PLATEAU)) return false;
    for (const e of SCATTER_EXCL) if (hypot(wx - e[0], wz - e[1]) < e[2]) return false;
  }
  return !blockedAt(x, z, Math.max(w, d) * 0.62);
}
function placeHousesAlong(edgeIdxs, o) {
  for (const ei of edgeIdxs) {
    const e = edges[ei];
    for (let s = o.start || 14; s < e.len - 12; s += o.spacing + rand(-3, 3)) {
      const [px, pz, tx, tz] = edgePoint(e, s);
      for (const side of [1, -1]) {
        if (rng() > o.prob) continue;
        const nx = -tz * side, nz = tx * side;
        const w = rand(o.w[0], o.w[1]), d = rand(o.d[0], o.d[1]);
        const off = ROAD_HW + 2.8 + d / 2 + rand(0, 2.5);
        const x = px + nx * off, z = pz + nz * off;
        const rot = Math.atan2(-nx, -nz);
        if (!houseFits(x, z, w, d, rot)) continue;
        addHouse(x, z, rot, w, d, pick(o.styles));
      }
    }
  }
}

// ---------- bridges, piers, ramps ----------
function addBridge(e) {
  const a = e.pts[0], b = e.pts[e.pts.length - 1];
  const dx = b[0] - a[0], dz = b[1] - a[1], L = hypot(dx, dz);
  const ux = dx / L, uz = dz / L, rot = Math.atan2(ux, uz);
  const cx = (a[0] + b[0]) / 2, cz = (a[1] + b[1]) / 2;
  const W = 12.6, deckY = 0.42;
  BRIDGES.push({ x: cx, z: cz, c: Math.cos(rot), s: Math.sin(rot), hw: W / 2, hl: L / 2, y: deckY, rampBoth: true });
  const P = placer(cx, cz, rot);
  const n = Math.floor(L / 1.05);
  const woods = [0xa9794d, 0xb98a5c, 0x9c6c44, 0xb07f52];
  for (let i = 0; i < n; i++) {
    const lz = -L / 2 + (i + 0.5) * (L / n);
    addStatic(box(W - rand(0, 0.5), 0.28, L / n - 0.14), woods[i % 4], P(rand(-0.15, 0.15), deckY - 0.14, lz), { jitter: 0.03 });
  }
  for (const sx of [-1, 1]) addStatic(box(0.6, 0.5, L), 0x6e4a31, P(sx * (W / 2 - 0.9), deckY - 0.5, 0));
  const posts = Math.max(3, Math.round(L / 4.6));
  for (let i = 0; i <= posts; i++) {
    const lz = -L / 2 + 0.4 + (i * (L - 0.8)) / posts;
    for (const sx of [-1, 1]) {
      addStatic(new THREE.CylinderGeometry(0.3, 0.34, 2.3, 7), 0x6b4730, P(sx * (W / 2 - 0.25), deckY + 1.0, lz), { outline: 'olWood' });
      if (i % 2 === 0) addStatic(new THREE.CylinderGeometry(0.42, 0.42, 4.2, 7), 0x5d3e2a, P(sx * (W / 2 - 1.2), -2.0, lz));
      if (i < posts) {
        const lz2 = -L / 2 + 0.4 + ((i + 1) * (L - 0.8)) / posts;
        const [g, m] = cylBetween(sx * (W / 2 - 0.25), deckY + 1.75, lz, sx * (W / 2 - 0.25), deckY + 1.55, lz2, 0.09, 0.09, 5);
        addStatic(g, 0xe0cfa1, P(0, 0, 0).multiply(m));
      }
    }
  }
  for (const sx of [-1, 1]) {
    const lx = sx * (W / 2 - 0.25);
    const p0 = [cx + lx * Math.cos(rot) + (-L / 2) * Math.sin(rot), cz - lx * Math.sin(rot) + (-L / 2) * Math.cos(rot)];
    const p1 = [cx + lx * Math.cos(rot) + (L / 2) * Math.sin(rot), cz - lx * Math.sin(rot) + (L / 2) * Math.cos(rot)];
    addCollider({ t: 2, ax: p0[0], az: p0[1], bx: p1[0], bz: p1[1], r: 0.42 });
  }
}
function addPier(pr) {
  const rot = Math.atan2(pr.dx, pr.dz);
  const L = pr.len, W = pr.w;
  BRIDGES.push({ x: pr.x, z: pr.z, c: Math.cos(rot), s: Math.sin(rot), hw: W / 2, hl: L / 2, y: pr.h, landEnd: -1 });
  const P = placer(pr.x, pr.z, rot);
  const n = Math.floor(L / 1.0);
  const woods = [0xa77748, 0xb88959, 0x9a6a42];
  for (let i = 0; i < n; i++) {
    const lz = -L / 2 + (i + 0.5) * (L / n);
    addStatic(box(W - rand(0, 0.4), 0.26, L / n - 0.12), woods[i % 3], P(rand(-0.12, 0.12), pr.h - 0.13, lz), { jitter: 0.03 });
  }
  const posts = Math.round(L / 5);
  for (let i = 0; i <= posts; i++) {
    const lz = -L / 2 + 0.5 + (i * (L - 1)) / posts;
    for (const sx of [-1, 1]) {
      addStatic(new THREE.CylinderGeometry(0.34, 0.38, 5.4, 7), 0x6b4730, P(sx * (W / 2 - 0.1), pr.h - 2.1, lz), { outline: 'olWood' });
    }
  }
  // mooring posts sticking up
  for (let i = 1; i < posts; i += 2) for (const sx of [-1, 1]) addStatic(new THREE.CylinderGeometry(0.28, 0.3, 1.2, 7), 0x5b3d29, P(sx * (W / 2 - 0.1), pr.h + 0.6, -L / 2 + 0.5 + (i * (L - 1)) / posts));
  // lamp at far end
  addStatic(new THREE.CylinderGeometry(0.14, 0.18, 3.6, 6), 0x3e5a4c, P(W / 2 - 0.6, pr.h + 1.8, L / 2 - 1));
  addStatic(box(0.7, 0.8, 0.7), 0xffe7a3, P(W / 2 - 0.6, pr.h + 3.8, L / 2 - 1));
  // boats alongside
  for (let k = 0; k < 2; k++) {
    const side = k === 0 ? 1 : -1;
    const lz = lerp(-L * 0.1, L * 0.35, k);
    const bp = new THREE.Vector3(side * (W / 2 + 2.6), 0, lz).applyMatrix4(new THREE.Matrix4().makeRotationY(rot));
    BOATS.push({ x: pr.x + bp.x, z: pr.z + bp.z, rot: rot + rand(-0.15, 0.15), ph: rand(0, TAU), kind: k });
  }
}
function rampHeightLocal(r, u) {
  if (!r.hump) return r.h * clamp(u / r.len, 0, 1);
  const a = r.len * 0.42;
  return u < a ? r.h * (u / a) : r.h * (1 - (u - a) / (r.len - a));
}
function addRampShape(r) {
  RAMP_SHAPES.push(r);
  const rot = Math.atan2(r.ux, r.uz);
  const P = placer(r.x, r.z, rot);
  const L = r.len, W = r.hw * 2;
  const n = 10;
  const woods = [0xb98a5a, 0xa77748, 0xc89a68];
  for (let i = 0; i < n; i++) {
    const u0 = (i / n) * L, u1 = ((i + 1) / n) * L;
    const h0 = rampHeightLocal(r, u0), h1 = rampHeightLocal(r, u1);
    const seg = Math.hypot(u1 - u0, h1 - h0);
    const ang = Math.atan2(h1 - h0, u1 - u0);
    addStatic(box(W, 0.28, seg + 0.05), (r.hump ? (i % 2 ? 0xf4f0e6 : 0xd9473d) : woods[i % 3]), P(0, (h0 + h1) / 2 - 0.12, -L / 2 + (u0 + u1) / 2, -ang, 0, 0));
  }
  if (!r.hump) {
    for (const sx of [-1, 1]) {
      const sh = new THREE.Shape(); sh.moveTo(0, 0); sh.lineTo(L, 0); sh.lineTo(L, r.h); sh.lineTo(0, 0);
      const g = new THREE.ExtrudeGeometry(sh, { depth: 0.35, bevelEnabled: false });
      g.rotateY(-Math.PI / 2); g.translate(0, 0, -L / 2);
      addStatic(g, 0x7d5536, P(sx * (W / 2 - 0.1) + (sx > 0 ? 0.35 : 0), 0, 0));
    }
    for (let i = 1; i <= 3; i++) {
      const u = (i / 3) * L - 0.3;
      for (const sx of [-1, 1]) addStatic(box(0.4, rampHeightLocal(r, u), 0.4), 0x6b4730, P(sx * (W / 2 - 0.6), rampHeightLocal(r, u) / 2, -L / 2 + u));
    }
    addStatic(box(W + 0.4, 0.5, 0.5), 0xf2c14e, P(0, r.h - 0.05, L / 2 - 0.2));
  }
}
function setupRamps() {
  for (const r of RAMPS) addRampShape({ x: r.x, z: r.z, ux: r.dx / hypot(r.dx, r.dz), uz: r.dz / hypot(r.dx, r.dz), len: r.len, hw: r.w / 2, h: r.h, hump: false, river: r.river });
  for (const hm of HUMPS) {
    const e = edges[hm.road];
    const [x, z, tx, tz] = edgePoint(e, e.len * hm.at);
    addRampShape({ x, z, ux: tx, uz: tz, len: hm.len, hw: ROAD_HW, h: hm.h, hump: true });
  }
}

function addLighthouse(x, z) {

function deckHeight(x, z) {
  let best = -100;

    const dx = x - b.x, dz = z - b.z;
    const lx = dx * b.c - dz * b.s, lz = dx * b.s + dz * b.c;
    if (Math.abs(lx) <= b.hw && Math.abs(lz) <= b.hl) {
      let y = b.y;
      if (b.rampBoth) y *= smoothstep(0, 3.5, b.hl - Math.abs(lz));
      else if (b.landEnd) y *= smoothstep(0, 4, lz * b.landEnd * -1 + b.hl);
      if (y > best) best = y;
    }
  }
  for (const r of RAMP_SHAPES) {
    const dx = x - r.x, dz = z - r.z;
    const u = dx * r.ux + dz * r.uz + r.len / 2;
    const v = -dx * r.uz + dz * r.ux;
    if (u >= 0 && u <= r.len && Math.abs(v) <= r.hw) {
      const y = rampHeightLocal(r, u);
      if (y > best) best = y;
    }

  return best;
}

  if (!AC) return;

    const ctx = new AC();

    AU.engGain = ctx.createGain(); AU.engGain.gain.value = 0;
    AU.engFilt.connect(AU.engGain); AU.engGain.connect(AU.master);
    const o1 = ctx.createOscillator(); o1.type = 'sawtooth'; o1.frequency.value = 60;
    const o2 = ctx.createOscillator(); o2.type = 'square'; o2.frequency.value = 30.5;
    const g2 = ctx.createGain(); g2.gain.value = 0.45;
    o1.connect(AU.engFilt); o2.connect(g2); g2.connect(AU.engFilt);
    o1.start(); o2.start();

  AU.engine[0].frequency.setTargetAtTime(52 + sp * 2.6 + thr * 14, now, 0.08);
  AU.engine[1].frequency.setTargetAtTime(26 + sp * 1.3 + thr * 7, now, 0.08);

function walkersStep(dt, t) {
  for (let i = walkers.length - 1; i >= 0; i--) {
    const w = walkers[i];

    if (d > 0.6) { const sp = Math.min(d, 5.5 * dt); w.x += (dx / d) * sp; w.z += (dz / d) * sp; }
    const g = w.ch.g;
    g.position.set(w.x, groundHeight(w.x, w.z) + Math.abs(Math.sin(t * 10)) * 0.25, w.z);
    if (d > 0.6) g.rotation.y = Math.atan2(dx, dz);
    if (d < 0.8 || w.t > 3.4) {
      w.fade += dt;
      g.scale.setScalar(w.s0 * Math.max(0, 1 - w.fade / 0.35));

  let h = Math.atan2(tx, tz);
  const gp = guidePoint(30);
  if (gp && (gp[0] - x) * tx + (gp[1] - z) * tz < 0) h += Math.PI;
  carReset(x, z, h);
  camState.yaw = h;
  for (let i = 0; i < 10; i++) puff(x + grand(-2, 2), 1, z + grand(-2, 2), grand(-3, 3), grand(2, 5), grand(-3, 3), grand(0.6, 1), 0.7, 0xffffff, -1);
}

// ---------- game flow ----------
function clearRun() {
  for (const p of patients) { scene.remove(p.ch.g); removePatientVisuals(scene, p); }
  patients.length = 0;
  for (const w of walkers) scene.remove(w.ch.g);
  walkers.length = 0;
  riding = null;
  pendingSpawns = [];
}
function startGame() {
  audioInit();
  clearRun();
  Object.assign(G, { time: 90, money: 0, saved: 0, fast: 0, bestAir: 0, combo: 0, comboT: 0, wrongT: 0, lowBeepT: 0, crashT: 0 });
  carReset(START.x, START.z, START.h);
  camState.yaw = START.h;
  for (let i = 0; i < 7; i++) spawnPatient(scene);
  updateGuide(true);
  G.state = 'countdown';
  G.countdown = 3.4;
  G.cdShown = 4;
  for (const k in hudCache) delete hudCache[k];
  showScreen('play');
  UI.bubble.hidden = true;
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
}
function showTitle() {
  clearRun();
  G.state = 'title';
  updateBestLines();
  showScreen('title');
}
function pauseGame() { if (G.state !== 'play' && G.state !== 'countdown') return; G.prevState = G.state; G.state = 'paused'; showScreen('pause'); if (AU.ctx) AU.ctx.suspend(); }
function resumeGame() { if (G.state !== 'paused') return; G.state = G.prevState || 'play'; showScreen('play'); if (AU.ctx) AU.ctx.resume(); last = performance.now(); }
function endGame() {
  G.state = 'ending';
  G.overT = 2.0;
  bigMsg('時間到！', '今天的班結束了', 1.9);
  sfx.over();
}
function showResults() {
  G.state = 'over';
  const [letter, name] = rankFor(G.money);
  UI.rankLetter.textContent = letter;
  UI.rankName.textContent = name;
  UI.stSaved.textContent = `${G.saved} 人`;
  UI.stMoney.textContent = '$' + G.money.toLocaleString('en-US');
  UI.stFast.textContent = `${G.fast} 次`;
  UI.stAir.textContent = `${G.bestAir.toFixed(1)} 秒`;
  const isNew = G.money > G.best;
  if (isNew) { G.best = G.money; saveState(); }
  UI.newBest.hidden = !isNew || G.money === 0;
  UI.overTitle.textContent = G.saved ? '下班了！' : '下班了…';
  updateBestLines();
  showScreen('over');
}

// ---------- per-frame simulation ----------
let acc = 0, last = performance.now();
const FROZEN = { gas: false, brake: false, drift: false, steer: 0 };
function simulate(dt) {
  const inp = readInput();
  const live = G.state === 'play';
  const useInp = live ? inp : FROZEN;
  G.crashT = Math.max(0, (G.crashT || 0) - dt);
  acc += dt;
  const STEP = 1 / 120;
  let n = 0;
  while (acc >= STEP && n < 10) {
    if (!live && !car.airborne && !car.sinking) { car.vx *= 1 - 6 * STEP; car.vz *= 1 - 6 * STEP; }
    carStep(STEP, useInp, ev);
    trafficCollide(ev);
    acc -= STEP; n++;
  }
  if (n === 10) acc = 0;
  if (car.sinking) {
    car.sinking -= dt;
    if (car.sinking <= 0) respawnCar();
  }
  trafficStep(dt, !!riding);
  pedStep(dt, ev);
  knockStep(dt, ev);
  patientsStep(dt, scene, ev);
  walkersStep(dt, G.t);
  for (let i = pendingSpawns.length - 1; i >= 0; i--) {
    pendingSpawns[i] -= dt;
    if (pendingSpawns[i] <= 0) { pendingSpawns.splice(i, 1); if (patients.filter((p) => p.state === 'wait').length < 7) spawnPatient(scene); }
  }
  if (G.state === 'countdown') {
    G.countdown -= dt;
    const shown = Math.ceil(G.countdown - 0.4);
    if (shown !== G.cdShown) {
      G.cdShown = shown;
      if (shown > 0) { bigMsg(String(shown), shown === 3 ? '準備出勤' : '', 0.9); sfx.beep(false); }
      else { bigMsg('出發！', '', 1.0); sfx.beep(true); G.state = 'play'; }
    }
  } else if (G.state === 'play') {
    G.time -= dt;
    G.comboT = Math.max(0, G.comboT - dt);
    G.wrongT = Math.max(0, G.wrongT - dt);
    if (G.time < 10 && G.time > 0) {
      const s = Math.ceil(G.time);
      if (s !== G.lowBeepT) { G.lowBeepT = s; sfx.tick(); }
    }
    if (riding) {
      riding.t -= dt;
      if (riding.t <= 0) {
        bubble(riding.hosp.kid ? '小病人' : '病人', '等太久了…我自己走過去好了！', riding.hosp, 2.6);
        toast('病人自己下車了', '', true);
        sfx.wrong();
        addWalker(riding.look, car.x + Math.cos(car.h) * 30, car.z - Math.sin(car.h) * 30, riding.hosp.kid);
        riding = null;
        updateGuide(true);
      } else if (car.speed < 4.2 && !car.airborne && !car.sinking) {
        for (const m of hospMarks) {
          if (hypot(car.x - m.n[0], car.z - m.n[1]) < 9.6) {
            if (m.H === riding.hosp) deliver(m);
            else if (G.wrongT <= 0) {
              G.wrongT = 3;
              sfx.wrong();
              bubble(riding.hosp.kid ? '小病人' : '病人', `這裡是${m.H.name}…<br>我要去的是 <b style="color:${riding.hosp.css}">${riding.hosp.name}</b> 啦！`, riding.hosp, 2.8);
            }
            break;
          }
        }
      }
    }
    if (G.time <= 0) { G.time = 0; endGame(); }
  } else if (G.state === 'ending') {
    G.overT -= dt;
    if (G.overT <= 0) showResults();
  }
  // car particles
  const fx = Math.sin(car.h), fz = Math.cos(car.h), rxv = -Math.cos(car.h), rzv = Math.sin(car.h);
  if (!car.airborne && !car.sinking) {
    const rearX = car.x - fx * 1.75, rearZ = car.z - fz * 1.75;
    if (car.slip > 4.2 && car.speed > 8) {
      G.skidT = (G.skidT || 0) - dt;
      if (G.skidT <= 0) {
        G.skidT = 0.028;
        for (const sd of [-1.2, 1.2]) skidMark(rearX + rxv * sd, rearZ + rzv * sd, car.h);
      }
      if (Math.random() < 0.6) puff(rearX + rxv * grand(-1.2, 1.2), 0.5, rearZ + rzv * grand(-1.2, 1.2), grand(-1, 1), grand(0.5, 1.5), grand(-1, 1), grand(0.5, 0.8), grand(0.5, 0.8), 0xf1ede4, 0.6);
    }
    if ((car.surface === 'sand' || car.surface === 'grass') && car.speed > 11 && Math.random() < 0.35) {
      puff(rearX + rxv * grand(-1.2, 1.2), 0.4, rearZ + rzv * grand(-1.2, 1.2), -car.vx * 0.08, grand(0.8, 2), -car.vz * 0.08, grand(0.35, 0.6), 0.6, car.surface === 'sand' ? 0xe8d39a : 0xb7c98a, 0.2);
    }
    if (car.surface === 'water' && car.speed > 2 && Math.random() < 0.7) {
      puff(car.x + rxv * grand(-1.5, 1.5) + fx * 2, WATER_Y + 0.3, car.z + rzv * grand(-1.5, 1.5) + fz * 2, rxv * grand(-5, 5), grand(3, 7), rzv * grand(-5, 5), grand(0.3, 0.6), 0.6, 0xffffff, -16, 0.4);
    }
  }
  if (car.sinking && Math.random() < 0.4) puff(car.x + grand(-1.5, 1.5), WATER_Y + 0.2, car.z + grand(-1.5, 1.5), 0, grand(1, 2), 0, grand(0.2, 0.4), 0.6, 0xe9fbff, 0);
  fxStep(dt);
}

function updateCamera(dt) {
  const a = camera.aspect;
  let fov, h, back, ahead;
  if (a < 1) { const t = clamp((a - 0.45) / 0.55, 0, 1); fov = lerp(60, 52, t); h = lerp(46, 36, t); back = lerp(19, 16, t); ahead = lerp(12, 9, t); }
  else { fov = 50; h = 38; back = 17; ahead = 10; }
  if (G.state === 'title' || G.state === 'loading') {
    camState.attract += dt * 0.05;
    const R = 92, cx = 20, cz = 10;
    camera.position.set(cx + Math.sin(camState.attract) * R, 70, cz + Math.cos(camState.attract) * R);
    camera.lookAt(cx, 0, cz);
    if (Math.abs(camera.fov - 50) > 0.01) { camera.fov = 50; camera.updateProjectionMatrix(); }
    fitFar(camera.position.y, hypot(camera.position.x - cx, camera.position.z - cz));
    focusShadow(cx, cz);
    camState.yaw = Math.atan2(cx - camera.position.x, cz - camera.position.z);
    return;
  }
  const sp = car.speed;
  h += sp * 0.22; back += sp * 0.07; ahead += sp * 0.24;
  if (car.vF > 2 || car.airborne) camState.yaw = dampAngle(camState.yaw, car.h, 3.0, dt);
  camState.px = damp(camState.px, car.x, 14, dt);
  camState.pz = damp(camState.pz, car.z, 14, dt);
  if (hypot(camState.px - car.x, camState.pz - car.z) > 30) { camState.px = car.x; camState.pz = car.z; }
  const fx = Math.sin(camState.yaw), fz = Math.cos(camState.yaw);
  const ty = Math.max(0, car.y) * 0.5;
  let sx = 0, sy = 0;
  if (camState.shake > 0) {
    sx = (Math.random() - 0.5) * camState.shake * 1.6; sy = (Math.random() - 0.5) * camState.shake * 1.2;
    camState.shake = Math.max(0, camState.shake - dt * 2.5);
  }
  camera.position.set(camState.px - fx * back + sx, ty + h + sy, camState.pz - fz * back);
  camera.lookAt(camState.px + fx * ahead + sx * 0.5, ty, camState.pz + fz * ahead);
  if (Math.abs(camera.fov - fov) > 0.01) { camera.fov = fov; camera.updateProjectionMatrix(); }
  fitFar(h + sy, back + ahead);
  focusShadow(car.x + fx * 20, car.z + fz * 20);
}
// pull the far plane in to just past the farthest visible ground so off-screen chunks get culled
function fitFar(height, horiz) {
  const pitch = Math.atan2(height, horiz);
  const edge = pitch - (camera.fov * Math.PI / 180) / 2;
  const far = edge > 0.06 ? Math.min(900, height / Math.sin(edge) + 45) : 900;
  if (Math.abs(camera.far - far) > 4) { camera.far = far; camera.updateProjectionMatrix(); }
}
function focusShadow(x, z) {
  const texel = 128 / 2048;
  const sx = Math.round(x / texel) * texel, sz = Math.round(z / texel) * texel;
  sun.target.position.set(sx, 0, sz);
  sun.position.set(sx + SUN_OFF.x, SUN_OFF.y, sz + SUN_OFF.z);
}

function frame(now) {
  requestAnimationFrame(frame);
  let dt = (now - last) / 1000;
  last = now;
  if (!(dt > 0)) dt = 0.016;
  dt = Math.min(dt, 0.05);
  G.t += dt;
  uTime.value = G.t;
  const active = G.state === 'play' || G.state === 'countdown' || G.state === 'ending';
  if (active) simulate(dt);
  else if (G.state === 'title' || G.state === 'over') { trafficStep(dt, false); pedStep(dt, ev); fxStep(dt); }
  // render-side updates
  if (G.state !== 'paused') {
    carVisual(dt, !!riding && active, G.t);
    trafficRender();
    pedRender(G.t);
    knockRender();
    boatsRender(G.t);
    patientsRender(G.t);
    hospitalsRender(G.t);
    if (DYN.lighthouse) DYN.lighthouse.rotation.y = G.t * 0.9;
    if (DYN.fountain && Math.random() < 0.5) puff(DYN.fountain[0] + grand(-0.6, 0.6), 3.4, DYN.fountain[1] + grand(-0.6, 0.6), grand(-1.6, 1.6), grand(3, 5), grand(-1.6, 1.6), 0.22, 0.9, 0xd9f6ff, -9, 0.2);
    if (Math.random() < 0.5) puff(FALLS.x + grand(-3, 3), WATER_Y + 0.6, FALLS.z + grand(-3, 3), grand(-1, 1), grand(1, 3), grand(-1, 1), grand(0.6, 1.1), 1.1, 0xf4fdff, 0.3, 1.2);
    if (active) {
      updateGuide(false);
      updateArrow(dt);
      updateHUD();
      if ((G.frameN = (G.frameN || 0) + 1) % 2 === 0) drawMinimap(G.t);
    } else FX.arrow.visible = false;
    updateCamera(dt);
    audioUpdate(dt, active && G.state !== 'ending');
  }
  renderer.render(scene, camera);
  adaptQuality(dt, active);
}
function updateArrow(dt) {
  const a = FX.arrow;
  const tgt = guide.target;
  if (!tgt || G.state !== 'play' || car.sinking) { a.visible = false; return; }
  const gp = guidePoint(22);
  const endD = hypot(tgt.px - car.x, tgt.pz - car.z);
  if (!gp || endD < 13) { a.visible = false; return; }
  a.visible = true;
  const dx = gp[0] - car.x, dz = gp[1] - car.z;
  a.rotation.y = dampAngle(a.rotation.y, Math.atan2(dx, dz), 9, dt);
  a.position.set(car.x, car.y + 6.6 + Math.sin(G.t * 3.2) * 0.3, car.z);
  FX.arrowMat.color.set(guide.color);
}
function adaptQuality(dt, active) {
  if (!active) return;
  quality.acc += dt; quality.frames++;
  if (quality.acc > 2.5) {
    const avg = quality.acc / quality.frames;
    if (avg > 0.026 && quality.pr > 1) {
      quality.pr = Math.max(1, quality.pr - 0.25);
      renderer.setPixelRatio(quality.pr);
      renderer.setSize(window.innerWidth, window.innerHeight, false);
    } else if (avg > 0.03 && sun.shadow.mapSize.x > 1024) {
      sun.shadow.mapSize.set(1024, 1024);
      if (sun.shadow.map) { sun.shadow.map.dispose(); sun.shadow.map = null; }
    }
    quality.acc = 0; quality.frames = 0;
  }
}

/*__DEBUG__*/
// boot (supports live-update handoff when the page is republished)
(function boot() {
  const start = (data) => init(data || {});
  const hot = window.claude && window.claude.hot;
  if (hot && hot.ready) hot.ready(start);
  else start((hot && hot.data) || {});
})();

})();
</script>
